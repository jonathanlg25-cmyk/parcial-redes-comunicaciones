apiVersion: 1

datasources:
  - name: Joomla PostgreSQL
    uid: joomla-postgres
    type: postgres
    access: proxy
    url: database:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: false
